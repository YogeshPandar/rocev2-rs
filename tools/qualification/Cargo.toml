[package]
name = "rocev2-qualification"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace]

[dependencies]
rocev2-core = { path = "../../crates/rocev2-core" }
rocev2-io = { path = "../../crates/rocev2-io", default-features = false, features = ["std", "placement"] }
rocev2-memory = { path = "../../crates/rocev2-memory" }
rocev2-wire = { path = "../../crates/rocev2-wire" }

[lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
module_name_repetitions = "allow"
