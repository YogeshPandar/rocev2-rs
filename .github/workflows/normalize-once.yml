name: normalize-once

on:
  push:
    branches: [feat/initial-rocev2-stack]

permissions:
  contents: write

concurrency:
  group: normalize-${{ github.ref }}
  cancel-in-progress: true

jobs:
  normalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply focused warning fixes
        shell: python
        run: |
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  raise SystemExit(f"missing expected text in {path}: {old!r}")
              file.write_text(text.replace(old, new, 1))

          replace(
              "crates/rocev2-wire/src/aeth.rs",
              "    Ack { credit: u8 },",
              "    Ack {\n        /// Advertised receive credit value.\n        credit: u8,\n    },",
          )
          replace(
              "crates/rocev2-wire/src/aeth.rs",
              "    RnrNak { timer: u8 },",
              "    RnrNak {\n        /// Five-bit receiver-not-ready delay code.\n        timer: u8,\n    },",
          )
          replace(
              "crates/rocev2-wire/src/aeth.rs",
              "    Reserved { code: u8 },",
              "    Reserved {\n        /// Preserved lower-five-bit syndrome value.\n        code: u8,\n    },",
          )
          replace(
              "crates/rocev2-wire/src/packet.rs",
              "Aeth, BTH_LEN, Bth, ICRC_LEN, Icrc, Opcode, RETH_LEN",
              "Aeth, BTH_LEN, Bth, ICRC_LEN, Icrc, RETH_LEN",
          )
          replace(
              "crates/rocev2-wire/src/packet.rs",
              "use crate::{Ipv4Header, UdpHeader, IPV4_HEADER_LEN, ROCE_V2_UDP_PORT, UDP_HEADER_LEN};",
              "use crate::{Ipv4Header, Opcode, UdpHeader, IPV4_HEADER_LEN, ROCE_V2_UDP_PORT, UDP_HEADER_LEN};",
          )
          replace(
              "crates/rocev2-wire/src/ipv4.rs",
              "pub fn internet_checksum(bytes: &[u8]) -> u16",
              "pub(crate) fn internet_checksum(bytes: &[u8]) -> u16",
          )
          error = Path("crates/rocev2-wire/src/error.rs")
          error_text = error.read_text()
          if "impl core::error::Error for WireError" not in error_text:
              error.write_text(error_text + "\nimpl core::error::Error for WireError {}\n")
          replace(
              "crates/rocev2-memory/src/lib.rs",
              "impl<'a, const N: usize> MemoryRegistry<'a, N> {",
              "#[allow(unsafe_code)]\nimpl<'a, const N: usize> MemoryRegistry<'a, N> {",
          )
      - name: Format workspace
        run: cargo fmt --all
      - name: Commit normalized source
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/normalize-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'chore: normalize and clear baseline warnings'
          git push origin HEAD:feat/initial-rocev2-stack
