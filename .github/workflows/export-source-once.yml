name: export-source-once

on:
  push:
    branches: [feat/initial-rocev2-stack]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: rocev2-source-${{ github.sha }}
          path: .
          include-hidden-files: true
          retention-days: 1
