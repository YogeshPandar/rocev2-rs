name: import-reviewed
on:
  push:
    branches: [feat/rc-production-hardening]
    paths: [.review/manifest.json]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: thumbv7em-none-eabihf
      - uses: dtolnay/rust-toolchain@1.85.0
      - name: Verify and apply reviewed source
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, lzma, pathlib, subprocess
          manifest = json.loads(pathlib.Path('.review/manifest.json').read_text())
          data = base64.b64decode(''.join(pathlib.Path('.review/import-' + str(i) + '.b64').read_text() for i in range(manifest['parts'])), validate=True)
          assert hashlib.sha256(data).hexdigest() == manifest['sha256']
          subprocess.run(['git', 'config', 'user.name', 'github-actions[bot]'], check=True)
          subprocess.run(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          for index, entry in enumerate(json.loads(lzma.decompress(data))):
              patch = pathlib.Path('/tmp/review-' + str(index) + '.patch')
              patch.write_text(entry['patch'])
              subprocess.run(['git', 'am', str(patch)], check=True)
          PY
      - name: Validate exact imported tree
        run: |
          cargo +stable fmt --all -- --check
          cargo +stable test --workspace --all-features --all-targets
          cargo +stable clippy --workspace --all-features --all-targets -- -D warnings
          cargo +stable check --workspace --no-default-features --target thumbv7em-none-eabihf
          cargo +1.85.0 test --workspace --all-features --all-targets
      - name: Publish tested implementation commits
        run: git push origin HEAD:feat/rc-production-hardening
      - name: Build and execute privileged kernel test
        run: |
          cargo +stable test -p rocev2 --all-features --test afxdp_veth --no-run --message-format=json > /tmp/build.jsonl
          binary=$(python3 -c 'import json; print(next(x["executable"] for x in map(json.loads, open("/tmp/build.jsonl")) if x.get("target", {}).get("name") == "afxdp_veth" and x.get("executable")))')
          sudo env ROCE_TEST_BINARY="$binary" bash scripts/test-afxdp-veth.sh
