name: recover-source

on:
  push:
    branches: [feat/initial-rocev2-stack]

jobs:
  validate-historical-archive:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate normalized historical archive
        shell: bash
        run: |
          set -euo pipefail
          historical_commit=4278ca1e79967e0861190ec4bbfb764d6fcc1905
          : > /tmp/rocev2-src.b64
          for index in 00 01 02 03 04 05 06 07 08; do
            git show "${historical_commit}:.bootstrap/part-${index}" | tr -cd 'A-Za-z0-9+/' >> /tmp/rocev2-src.b64
          done
          remainder=$(( $(wc -c < /tmp/rocev2-src.b64) % 4 ))
          if [ "$remainder" -eq 2 ]; then printf '==' >> /tmp/rocev2-src.b64; fi
          if [ "$remainder" -eq 3 ]; then printf '=' >> /tmp/rocev2-src.b64; fi
          if [ "$remainder" -eq 1 ]; then exit 1; fi
          base64 --decode /tmp/rocev2-src.b64 > /tmp/rocev2-src.tgz
          gzip --test /tmp/rocev2-src.tgz
          tar --list --gzip --file /tmp/rocev2-src.tgz
