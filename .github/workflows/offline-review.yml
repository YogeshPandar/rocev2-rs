name: offline-review

on:
  push:
    branches: [feat/rc-production-hardening]
    paths: [.github/workflows/offline-review.yml]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: rustfmt, clippy
          targets: thumbv7em-none-eabihf
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf
      - name: Archive explicit review toolchains
        shell: bash
        run: |
          mkdir -p review
          rustup run 1.85.0 rustc --version --verbose > review/msrv.txt
          sysroot="$(rustup run 1.85.0 rustc --print sysroot)"
          tar -C "$sysroot" -c bin lib | xz -T2 -1 > review/msrv.tar.xz
          sysroot="$(rustup run stable rustc --print sysroot)"
          tar -C "$sysroot" -c lib/rustlib/thumbv7em-none-eabihf | xz -T2 -1 > review/stable-target.tar.xz
          uname -a > review/kernel.txt
          ls /sys/class/infiniband >> review/kernel.txt 2>&1 || true
          modinfo rdma_rxe >> review/kernel.txt 2>&1 || true
      - uses: actions/upload-artifact@v4
        with:
          name: explicit-review-${{ github.sha }}
          path: review
          retention-days: 1
          compression-level: 0
