name: refresh-standalone-lockfiles
on:
  push:
    branches: [feat/release-code-hardening]
    paths:
      - .github/workflows/refresh-standalone-lockfiles.yml
permissions:
  contents: write
concurrency:
  group: refresh-standalone-lockfiles
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - name: Refresh lockfiles
        run: |
          set -euo pipefail
          cargo +1.85.0 generate-lockfile --manifest-path interop/rust-peer/Cargo.toml
          cargo +1.85.0 generate-lockfile --manifest-path tools/qualification/Cargo.toml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add interop/rust-peer/Cargo.lock tools/qualification/Cargo.lock
          if ! git diff --cached --quiet; then
            git commit -m 'build: refresh standalone lockfiles'
            git push origin HEAD:feat/release-code-hardening
          fi
