name: remove-broken-bootstrap

on:
  push:
    branches: [feat/initial-rocev2-stack]

permissions:
  contents: write

concurrency:
  group: bootstrap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  remove:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove unrecoverable staged archive
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .bootstrap .github/workflows/bootstrap.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'chore: remove unrecoverable bootstrap archive'
          git push origin HEAD:feat/initial-rocev2-stack
