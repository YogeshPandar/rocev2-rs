name: release-code-review
on:
  push:
    branches: [feat/release-code-hardening]
    paths: [.review/release-code.patch]
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: release-code-review
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: thumbv7em-none-eabihf
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
      - name: Apply source checkpoint
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, lzma, pathlib
          path = pathlib.Path('.review/release-code.patch')
          header, encoded = path.read_bytes().split(b'\n', 1)
          patch = lzma.decompress(base64.b64decode(encoded.strip(), validate=True))
          assert header == b'xz:' + hashlib.sha256(patch).hexdigest().encode()
          pathlib.Path('/tmp/release-code.patch').write_bytes(patch)
          PY
          git apply --check /tmp/release-code.patch
          git apply /tmp/release-code.patch
          git rm .review/release-code.patch
          cargo +stable fmt --all
          cargo +1.85.0 generate-lockfile
          for manifest in fuzz/Cargo.toml interop/rust-peer/Cargo.toml tools/qualification/Cargo.toml; do
            if test -f "$manifest"; then
              cargo +stable fmt --manifest-path "$manifest"
              cargo +stable generate-lockfile --manifest-path "$manifest"
            fi
          done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: add executable release qualification tooling'
          git push origin HEAD:feat/release-code-hardening
      - name: Workspace tests
        run: cargo +stable test --locked --workspace --all-features --all-targets
      - name: Strict Clippy
        run: cargo +stable clippy --locked --workspace --all-features --all-targets -- -D warnings
      - name: no_std
        run: cargo +stable check --locked --workspace --no-default-features --target thumbv7em-none-eabihf
      - name: MSRV
        run: cargo +1.85.0 check --locked --workspace --all-features
      - name: Hosted tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libibverbs-dev
          cargo +stable test --locked --manifest-path interop/rust-peer/Cargo.toml
          cargo +stable clippy --locked --manifest-path interop/rust-peer/Cargo.toml --all-targets -- -D warnings
          cargo +1.85.0 check --locked --manifest-path interop/rust-peer/Cargo.toml
          cargo +stable test --locked --manifest-path tools/qualification/Cargo.toml
          cargo +stable clippy --locked --manifest-path tools/qualification/Cargo.toml --all-targets -- -D warnings
          cargo +1.85.0 check --locked --manifest-path tools/qualification/Cargo.toml
          make -C interop/rxe-peer clean test
          python3 -m unittest discover -s interop/tests -v
          bash -n interop/scripts/*.sh
      - name: Fuzz oracle smoke
        run: cargo +stable test --locked --manifest-path fuzz/Cargo.toml --lib
