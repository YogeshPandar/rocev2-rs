name: release-code-review
on:
  push:
    branches: [feat/release-code-hardening]
    paths:
      - crates/**
      - interop/**
      - tools/**
      - fuzz/**
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/release-code-review.yml
permissions:
  contents: read
concurrency:
  group: release-code-review
  cancel-in-progress: true
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: thumbv7em-none-eabihf
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: |
          cargo +stable fmt --all --check
          cargo +stable fmt --manifest-path fuzz/Cargo.toml --check
          cargo +stable fmt --manifest-path interop/rust-peer/Cargo.toml --check
          cargo +stable fmt --manifest-path tools/qualification/Cargo.toml --check
      - name: Workspace tests
        run: cargo +stable test --locked --workspace --all-features --all-targets
      - name: Strict Clippy
        run: cargo +stable clippy --locked --workspace --all-features --all-targets -- -D warnings
      - name: no_std
        run: cargo +stable check --locked --workspace --no-default-features --target thumbv7em-none-eabihf
      - name: MSRV
        run: cargo +1.85.0 check --locked --workspace --all-features
      - name: Hosted tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libibverbs-dev
          cargo +stable test --locked --manifest-path interop/rust-peer/Cargo.toml
          cargo +stable clippy --locked --manifest-path interop/rust-peer/Cargo.toml --all-targets -- -D warnings
          cargo +1.85.0 check --locked --manifest-path interop/rust-peer/Cargo.toml
          cargo +stable test --locked --manifest-path tools/qualification/Cargo.toml
          cargo +stable clippy --locked --manifest-path tools/qualification/Cargo.toml --all-targets -- -D warnings
          cargo +1.85.0 check --locked --manifest-path tools/qualification/Cargo.toml
          make -C interop/rxe-peer clean test
          python3 -m unittest discover -s interop/tests -v
          bash -n interop/scripts/*.sh
      - name: Fuzz oracle smoke
        run: cargo +stable test --locked --manifest-path fuzz/Cargo.toml --lib
