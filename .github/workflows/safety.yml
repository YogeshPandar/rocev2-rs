name: safety
on:
  workflow_dispatch:
  schedule:
    - cron: '19 3 * * 1'
  pull_request:
    paths: ['fuzz/**', 'crates/**', 'interop/**', '.github/workflows/safety.yml']
permissions:
  contents: read
concurrency:
  group: safety-${{ github.ref }}
  cancel-in-progress: true
jobs:
  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: [wire_decode, wire_roundtrip, memory_registry, rc_events]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-fuzz --locked
      - run: cargo +nightly fuzz run ${{ matrix.target }} -- -max_len=8192 -max_total_time=60 -timeout=10 -rss_limit_mb=2048
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: fuzz-${{ matrix.target }}-${{ github.sha }}
          path: |
            fuzz/corpus
            fuzz/artifacts
  miri:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - run: cargo +nightly miri setup
      - run: cargo +nightly miri test -p rocev2-memory -p rocev2-core -p rocev2-wire --lib
        env:
          MIRIFLAGS: -Zmiri-strict-provenance
      - run: cargo +nightly miri test -p rocev2 --no-default-features --lib connection::tests
        env:
          MIRIFLAGS: -Zmiri-strict-provenance
  asan:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - run: cargo +nightly test -Zbuild-std --target x86_64-unknown-linux-gnu --workspace --no-default-features --lib --tests
        env:
          RUSTFLAGS: -Zsanitizer=address
          RUSTDOCFLAGS: -Zsanitizer=address
          ASAN_OPTIONS: detect_leaks=1
      - run: sudo apt-get update -qq && sudo apt-get install -y libibverbs-dev
      - run: make -C interop/rxe-peer sanitize
      - run: interop/rxe-peer/rxe-peer --self-test
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
