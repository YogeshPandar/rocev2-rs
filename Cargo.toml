[workspace]
resolver = "2"
members = [
    "crates/rocev2-wire",
    "crates/rocev2-core",
    "crates/rocev2-memory",
    "crates/rocev2-io",
    "crates/rocev2",
]
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["rocev2-rs contributors"]
repository = "https://github.com/YogeshPandar/rocev2-rs"
homepage = "https://github.com/YogeshPandar/rocev2-rs"
keywords = ["rdma", "roce", "networking", "no-std", "zero-copy"]
categories = ["network-programming", "no-std"]

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unreachable_pub = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.bench]
lto = "thin"
codegen-units = 1
